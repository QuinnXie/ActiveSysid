<svg xmlns="http://www.w3.org/2000/svg" width="430" height="70" viewBox="0 0 430 70" role="img" aria-labelledby="title desc">
  <title id="title">ActiveSysID logo</title>
  <desc id="desc">A transparent ActiveSysID wordmark with a deep-to-light purple gradient.</desc>
  <defs>
    <linearGradient id="textGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3b0764"/>
      <stop offset="0.52" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <text x="215" y="57" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800"
        fill="url(#textGradient)">ActiveSysID</text>
</svg>
